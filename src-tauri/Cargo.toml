[package]
name = "micu-omniprobe"
version = "3.2.0"
description = "MICU-OmniProbe - 嵌入式开发一体化调试与分析工作台（烧录 / 源码调试 / RTT / 串口 / 蓝牙 / 日志分析）"
authors = ["zuolan"]
edition = "2021"

[lib]
name = "micu_omniprobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
probe-rs = "0.32"
probe-rs-espressif = "0.32"
nusb = "0.1.14"
quick-xml = { version = "0.37", features = ["serialize"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
encoding_rs = "0.8"
zip = "2"
directories = "5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
object = "0.36"
addr2line = "0.24"
gimli = "0.31"
base64 = "0.22"
serialport = "4.10"
zmodem2 = "0.7.1"
btleplug = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }
futures = "0.3"
tauri-plugin-clipboard-manager = "2.4"

[target.'cfg(windows)'.dependencies]
libloading = "0.7"
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 数据链路（RTT 轮询、串口分帧、烧录）对速度敏感，优先选 3 而不是体积档 "s"/"z"
opt-level = 3
lto = true
codegen-units = 1
strip = true
# 刻意不设 panic = "abort"：当前 RTT / 串口 / BLE 采集都跑在独立任务里，
# 单个任务 panic 只会终止该任务；改成 abort 会让一次探针异常直接杀掉整个进程，
# 连带丢掉用户尚未导出的采集数据。省下的体积不值这个代价。
